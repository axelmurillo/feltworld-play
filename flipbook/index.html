<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#17191c;color:#dedbd3;font:15px/1.4 system-ui}main{height:100svh;min-height:280px;display:flex;flex-direction:column;padding:16px;gap:10px}header,footer{width:100%;max-width:1300px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:16px;font-weight:500;margin:0}.hint{color:#a5a7aa;font-size:13px;margin:0}.stage{position:relative;overflow:hidden;flex:1;min-height:0;display:flex;justify-content:center;align-items:center;perspective:2300px}.book{position:relative;width:min(100%,calc((100svh - 150px)*1.5));max-width:1300px;aspect-ratio:3/2;touch-action:pan-y;user-select:none;cursor:pointer;isolation:isolate;box-shadow:0 0 0 1px #ffffff0d,0 0 22px #0004,0 12px 28px #0005,0 28px 52px -18px #0008;background:#17191c;border-radius:2px}.book.dragging{cursor:grabbing}.spread{position:absolute;inset:0;display:flex;overflow:hidden;border-radius:2px}.spread img,.stationary img{width:50%;height:100%;display:block;object-fit:fill;pointer-events:none}.crease{position:absolute;z-index:8;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 46%,#20190b05 48.2%,#20190b30 49.8%,#fff4 50.05%,#20190b20 50.2%,#20190b06 52%,transparent 54%)}.crease:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#211c1760;box-shadow:-1px 0 1px #fff3}.stationary{position:absolute;top:0;bottom:0;width:50%;z-index:2;overflow:hidden}.stationary img{width:100%}.leaf{position:absolute;top:0;bottom:0;width:50%;z-index:5;transform-style:preserve-3d;will-change:transform;pointer-events:none}.leaf.forward{right:0;transform-origin:left center}.leaf.backward{left:0;transform-origin:right center}.face{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;background:#17191c}.face img{width:100%;height:100%;display:block;pointer-events:none}.face.back{transform:rotateY(180deg)}.face:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#251c1240,transparent 25%,#fff1 80%,#251c1220);opacity:var(--shade,0)}.leaf.forward .front{box-shadow:-8px 0 18px #20180c20}.leaf.backward .front{box-shadow:8px 0 18px #20180c20}button,a,summary{-webkit-tap-highlight-color:transparent}button{border:1px solid #ffffff26;background:#ffffff06;color:inherit;border-radius:50%;width:42px;height:42px;font-size:22px;cursor:pointer}button:disabled{opacity:.25;cursor:default}button:focus-visible,a:focus-visible,summary:focus-visible,.book:focus-visible{outline:2px solid #d2b782;outline-offset:4px}.controls{display:flex;align-items:center;gap:16px}#position{font-size:13px;font-variant-numeric:tabular-nums;min-width:36px;text-align:center}#scene{font-size:14px;margin:0}details{position:relative;font-size:12px}summary{cursor:pointer;list-style:none}details[open] .links{position:absolute;bottom:28px;right:0;padding:14px;background:#24272c;box-shadow:0 6px 24px #0007;border-radius:5px;width:170px;display:grid;gap:12px;z-index:20}.links a{color:#d2b782}button:hover:not(:disabled){background:#ffffff10} [hidden]{display:none!important}@media(max-width:600px){main{padding:10px}header{align-items:flex-start;flex-direction:column;gap:3px}.stage{perspective:1300px}footer{flex-wrap:wrap}#scene{font-size:12px}.controls{gap:9px}button{width:38px;height:38px}.hint{font-size:12px}}@media(prefers-reduced-motion:reduce){.leaf{will-change:auto}}
.header-links{display:flex;align-items:center;gap:20px}.header-links a{font-size:13px;color:#d2b782;text-decoration:none}.header-links a:hover{text-decoration:underline}@media(max-width:600px){.header-links{width:100%;justify-content:space-between;gap:10px}}

.book.cover-mode{background:transparent;box-shadow:none;width:min(100%,calc((100svh - 150px)*.75));aspect-ratio:3/4}
.book.cover-mode .crease{display:none}
.book.cover-mode .spread{overflow:visible;transform-origin:center}
.cover{position:relative;width:100%;height:100%;margin:auto;box-shadow:0 0 0 1px #ffffff16,0 12px 28px #0006,0 28px 52px -18px #000a;border-radius:2px;overflow:hidden;background:#17191c}
.cover img{width:100%;height:100%;object-fit:cover}
.cover:after{content:none}
.cover.front:before{content:"";position:absolute;inset:0 auto 0 0;width:3%;background:linear-gradient(90deg,#0004,#fff2,transparent);z-index:2}
.cover.back:before{content:"";position:absolute;inset:0 0 0 auto;width:3%;background:linear-gradient(270deg,#0004,#fff2,transparent);z-index:2}

<body>
<main>
<header><h1 id="scene">Front cover</h1><div class="header-links"><p class="hint">Tap, drag or use ← →</p><a href="https://axelmurillo.github.io/feltworld-play/character-review/">Characters</a></div></header>
<div class="stage"><div class="book" id="book" tabindex="0" role="group" aria-label="Illustrated book, front cover, 1 of 11"><div class="spread" id="spread"></div><div class="crease"></div></div></div>
<footer><div class="controls"><button id="first" aria-label="First spread" title="First spread" disabled>⇤</button><button id="previous" aria-label="Previous spread" disabled>‹</button><span id="position" aria-live="polite">1 / 11</span><button id="next" aria-label="Next spread">›</button><button id="last" aria-label="Last spread" title="Last spread">⇥</button></div><details><summary>Download this scene</summary><div class="links"><a id="left-download" download>Left page</a><a id="right-download" download>Right page</a><a id="master-download" download>Full spread</a></div></details></footer>
</main>
<script>
const scenes=[['cover-front','Front cover'],['06-tree-fortress-sanctuary','Inside their sanctuary'],['05-tree-fortress-exterior','Lumi and Kitty’s tree-fortress'],['08-jack-search','Jack searches for Doggy'],['09-nomie-search-mansion','Nomie searches outside her mansion'],['07-doggy-alone','Doggy waits in the snow'],['04-trio-lake','The quiet lake'],['01-woodland-bridge','Woodland bridge'],['03-manor-welcome','A welcome at the mansion'],['02-manor-interior','Inside the mansion'],['cover-back','Back cover']];
const book=document.querySelector('#book'),spread=document.querySelector('#spread'),previous=document.querySelector('#previous'),next=document.querySelector('#next');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let index=0,turn=null,pointer=null,animating=false;
const revision='20261002-mansion-home-fresh-v1';
const isCover=i=>scenes[i][0].startsWith('cover-');
const coverPath=i=>'covers/'+(i===0?'front-cover-v1.png':'back-cover-v1.png')+'?v=periwinkle-1';
const path=(i,side)=>`${scenes[i][0]}-part-${side==='left'?1:2}-${side}.png?v=${revision}`;
const img=(i,side)=>{const e=new Image();e.src=isCover(i)?coverPath(i):path(i,side);e.alt=isCover(i)?(i===0?'A World of Felt. Vol. I: Doggy! By John Smith.':'Copyright John Smith, 2026.'):`${scenes[i][1]}, ${side} page`;e.draggable=false;return e};
const ready=new Map();
for(let i=0;i<scenes.length;i++)for(const side of isCover(i)?['right']:['left','right']){
 const image=img(i,side),key=isCover(i)?coverPath(i):path(i,side);
 ready.set(key,{image,loaded:false,promise:image.decode().then(()=>{ready.get(key).loaded=true;}).catch(()=>{})});
}
const resources=i=>isCover(i)?[coverPath(i)]:[path(i,'left'),path(i,'right')];
const canTurn=i=>resources(i).every(key=>ready.get(key)?.loaded);
const waitForArt=i=>Promise.all(resources(i).map(key=>ready.get(key).promise));
function coverElement(i){const e=document.createElement('div');e.className='cover '+(i===0?'front':'back');e.append(img(i,'right'));return e;}
function geometry(cover){const probe=book.cloneNode(false);probe.removeAttribute('id');probe.classList.toggle('cover-mode',cover);Object.assign(probe.style,{position:'absolute',visibility:'hidden',left:'50%',top:'50%',transform:'translate(-50%,-50%)'});book.parentElement.append(probe);const rect=probe.getBoundingClientRect(),stage=book.parentElement.getBoundingClientRect();probe.remove();return {x:rect.left-stage.left,y:rect.top-stage.top,w:rect.width,h:rect.height};}
function beginBoundary(direction,target){
 const layer=document.createElement('div');layer.className='boundary';book.parentElement.append(layer);
 if(isCover(index)&&isCover(target)){
  const g=geometry(true),panels=[index,target].map(i=>{const e=document.createElement('div');e.className='boundary-cover';Object.assign(e.style,{left:g.x+'px',top:g.y+'px',width:g.w+'px',height:g.h+'px'});e.append(coverElement(i));layer.append(e);return e;});
  turn={direction,target,boundary:true,layer,panels,progress:0};
 }else{
  const coverIndex=isCover(index)?index:target,interiorIndex=isCover(index)?target:index;
  const opening=isCover(index),front=coverIndex===0,g=geometry(false),c=geometry(true),half=g.w/2;
  const sheet=document.createElement('div');sheet.className='boundary-sheet';Object.assign(sheet.style,{left:g.x+'px',top:g.y+'px',width:g.w+'px',height:g.h+'px'});const left=img(interiorIndex,'left'),right=img(interiorIndex,'right');(front?left:right).style.visibility='hidden';sheet.append(left,right);sheet.style.boxShadow='none';
  const crease=document.createElement('div');crease.className='crease';sheet.append(crease);layer.append(sheet);
  const leaf=document.createElement('div');leaf.className='boundary-leaf';Object.assign(leaf.style,{left:(g.x+(front?half:0))+'px',top:g.y+'px',width:half+'px',height:g.h+'px',transformOrigin:front?'left center':'right center'});
  const outer=document.createElement('div');outer.className='face front';outer.append(coverElement(coverIndex));
  const inner=document.createElement('div');inner.className='face back';inner.append(img(interiorIndex,front?'left':'right'));leaf.append(outer,inner);layer.append(leaf);
  turn={direction,target,boundary:true,layer,sheet,leaf,opening,front,scale:c.h/g.h,coverWidth:c.w,progress:0};
 }
 book.style.visibility='hidden';setProgress(0);return true;
}
function render(){book.classList.toggle('cover-mode',isCover(index));spread.style.transform='';spread.style.opacity='';if(isCover(index)){const cover=document.createElement('div');cover.className='cover '+(index===0?'front':'back');cover.append(img(index,'right'));spread.replaceChildren(cover);}else spread.replaceChildren(img(index,'left'),img(index,'right'));previous.disabled=index===0;next.disabled=index===scenes.length-1;document.querySelector('#first').disabled=index===0;document.querySelector('#last').disabled=index===scenes.length-1;document.querySelector('#position').textContent=`${index+1} / ${scenes.length}`;document.querySelector('#scene').textContent=scenes[index][1];book.setAttribute('aria-label',`Illustrated book, ${scenes[index][1]}, spread ${index+1} of ${scenes.length}`);document.querySelector('#left-download').href=path(index,'left');document.querySelector('#right-download').href=path(index,'right');document.querySelector('#master-download').href=`masters/${scenes[index][0]}-master.png?v=${revision}`;document.querySelector('details').hidden=isCover(index);}
function begin(direction,target=index+direction){if(target<0||target>=scenes.length)return false;if(!canTurn(index)||!canTurn(target))return false;if(isCover(index)||isCover(target))return beginBoundary(direction,target);spread.replaceChildren(img(target,'left'),img(target,'right'));const stationary=document.createElement('div');stationary.className='stationary';stationary.style[direction===1?'left':'right']='0';stationary.append(img(index,direction===1?'left':'right'));const leaf=document.createElement('div');leaf.className=`leaf ${direction===1?'forward':'backward'}`;for(const [face,i,side] of [['front',index,direction===1?'right':'left'],['back',target,direction===1?'left':'right']]){const e=document.createElement('div');e.className=`face ${face}`;e.append(img(i,side));leaf.append(e)}book.append(stationary,leaf);turn={direction,target,leaf,stationary,progress:0};setProgress(0);return true;}
function setProgress(value){if(!turn)return;turn.progress=Math.max(0,Math.min(1,value));if(turn.boundary){
 const p=turn.progress;
 if(turn.panels){turn.panels[0].style.opacity=1-p;turn.panels[1].style.opacity=p;turn.panels[0].style.transform=`rotateY(${-turn.direction*25*p}deg)`;turn.panels[1].style.transform=`rotateY(${turn.direction*25*(1-p)}deg)`;return;}
 const q=turn.opening?p:1-p,s=turn.scale+(1-turn.scale)*q;
 const shift=(turn.front?-1:1)*turn.coverWidth/2*(1-q);
 turn.sheet.style.transform=`translateX(${shift}px) scale(${s})`;turn.sheet.style.opacity=Math.min(1,q*4);
 turn.leaf.style.transform=`translateX(${shift}px) scale(${s}) rotateY(${(turn.front?-180:180)*q}deg)`;
 turn.leaf.style.setProperty('--shade',Math.sin(q*Math.PI)*.65);return;
 }turn.leaf.style.transform=`rotateY(${turn.direction*-180*turn.progress}deg)`;turn.leaf.style.setProperty('--shade',Math.sin(turn.progress*Math.PI)*.8);turn.stationary.hidden=turn.progress>=.5;}
function finish(commit){if(!turn)return;if(commit)index=turn.target;if(turn.boundary){turn.layer.remove();book.style.visibility='';}else{turn.leaf.remove();turn.stationary.remove();}turn=null;animating=false;book.classList.remove('dragging');render();}
function settle(commit){if(!turn)return;animating=true;const from=turn.progress,to=commit?1:0;if(reduced.matches){finish(commit);return;}const duration=Math.max(160,(turn.boundary?850:560)*Math.abs(to-from));let start;function frame(time){start??=time;const t=Math.min(1,(time-start)/duration),e=turn.boundary?t*t*(3-2*t):1-Math.pow(1-t,3);setProgress(from+(to-from)*e);if(t<1)requestAnimationFrame(frame);else finish(commit)}requestAnimationFrame(frame);}
async function go(target,direction){if(animating||pointer||target<0||target>=scenes.length||target===index)return;animating=true;await Promise.all([waitForArt(index),waitForArt(target)]);animating=false;if(begin(direction,target))settle(true);}
function navigate(direction){go(index+direction,direction);}
previous.onclick=()=>navigate(-1);next.onclick=()=>navigate(1);
function jump(target){go(target,Math.sign(target-index));}
document.querySelector('#first').onclick=()=>jump(0);document.querySelector('#last').onclick=()=>jump(scenes.length-1);
document.addEventListener('keydown',e=>{if(e.target.closest('summary,a'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();navigate(e.key==='ArrowRight'?1:-1)}});
book.addEventListener('pointerdown',e=>{if(animating||pointer||e.isPrimary===false||e.button!==0)return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY,lastX:e.clientX,lastTime:performance.now(),velocity:0,moved:false};book.setPointerCapture(e.pointerId);});
book.addEventListener('pointermove',e=>{if(!pointer||e.pointerId!==pointer.id)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.hypot(dx,dy)>8)pointer.moved=true;if(!turn){if(Math.abs(dx)<10)return;if(Math.abs(dy)>Math.abs(dx)){book.releasePointerCapture(e.pointerId);pointer=null;return;}if(!begin(dx<0?1:-1))return;book.classList.add('dragging');}const now=performance.now();pointer.velocity=(e.clientX-pointer.lastX)/Math.max(1,now-pointer.lastTime);pointer.lastX=e.clientX;pointer.lastTime=now;setProgress(-dx*turn.direction/(book.clientWidth*.65));});
function release(e,cancel){if(!pointer||e.pointerId!==pointer.id)return;const {velocity,moved,x,y}=pointer;pointer=null;if(turn)settle(!cancel&&(turn.progress>.22||(turn.progress>.04&&velocity*turn.direction<-.5)));else if(!cancel&&!moved&&Math.hypot(e.clientX-x,e.clientY-y)<=8){const rect=book.getBoundingClientRect();navigate(isCover(index)?(index===0?1:-1):(e.clientX<rect.left+rect.width/2?-1:1));}book.classList.remove('dragging');}
book.addEventListener('pointerup',e=>release(e,false));book.addEventListener('pointercancel',e=>release(e,true));book.addEventListener('lostpointercapture',e=>{if(pointer)release(e,true)});
render();
</script>
